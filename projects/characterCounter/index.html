<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>character counter</title>
</head>
<body>
<div class='input'>
    <label class="input-label">
            <textarea
                    class="input-textarea"
                    cols="80"
                    rows="20"></textarea>
    </label>
</div>
<div class="data">
    <div class="div-counter">
        <p class="counter">всего символов</p>
        <p class="symbols">0</p>
    </div>

    <div class="div-specCounter">
        <p class="spec-counter">спецсимволов</p>
        <p class="spec-symbols">0</p>
    </div>

    <div class="div-numCounter">
        <p class="num-counter">цифр</p>
        <p class="nums">0</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
